<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <meta name="description" content="eunoia. Joyas en Plata 925. Anillos, aros, argollas, collares, pulseras y charms con envíos por Andreani a todo el país." />
    <!-- Un único theme-color, sin atributo media; el script lo pasa a #151515 cuando el sistema está en modo oscuro.
         Los colores son los de --bg en styles.css. -->
    <meta name="theme-color" content="#FAFAFA" />
    <script>
      (function () {
        var meta = document.querySelector('meta[name="theme-color"]');
        var dark = window.matchMedia('(prefers-color-scheme: dark)');
        function sync() { meta.setAttribute('content', dark.matches ? '#151515' : '#FAFAFA'); }
        sync();
        if (dark.addEventListener) dark.addEventListener('change', sync);
        else if (dark.addListener) dark.addListener(sync);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
    <title>eunoia. | Joyas en Plata 925</title>
  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
